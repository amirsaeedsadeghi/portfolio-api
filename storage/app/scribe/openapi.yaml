openapi: 3.0.3
info:
  title: 'portfolio-api API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: 'About Me'
    description: "\nManage your About Me information in the portfolio."
  -
    name: Authentication
    description: "\nAPIs for user authentication using JWT"
  -
    name: 'Contact Me'
    description: "\nManage contact messages submitted through the portfolio."
  -
    name: Endpoints
    description: ''
  -
    name: Honeypot
    description: "\nRetrieve honeypot configuration and a one-time token for form protection.\n\nThis endpoint provides a server-generated token and field names used to detect bots.\nUse it before rendering or submitting protected forms."
  -
    name: 'Navbar Items'
    description: "\nManage navigation items used in the portfolio header."
  -
    name: 'Project Images'
    description: "\nManage images that belong to a project."
  -
    name: Projects
    description: "\nManage portfolio projects (list, create, view, update, delete)."
  -
    name: Skills
    description: "\nAPIs for managing skills."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Use "Authorization: Bearer &lt; JWT &gt;"'
security:
  -
    default: []
paths:
  /api/v1/about-me:
    post:
      summary: 'Create About Me information'
      operationId: createAboutMeInformation
      description: 'Stores a new About Me record (only one is allowed).'
      parameters: []
      responses:
        201:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n \"status\": true,\n \"message\": \"About Me created successfully\",\n \"data\": {\n   \"id\": 1,\n   \"title\": \"Full Stack Developer\",\n   \"summary\": \"...\",\n   \"location\": \"...\",\n   \"yearsOfExperience\": 5,\n   \"language\": \"...\",\n   ...\n }\n}"
      tags:
        - 'About Me'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Professional title.'
                  example: 'Full Stack Developer'
                  nullable: false
                summary:
                  type: string
                  description: 'Short summary about yourself.'
                  example: 'Experienced Laravel + React developer.'
                  nullable: false
                location:
                  type: string
                  description: 'Your current location.'
                  example: 'Dublin, Ireland'
                  nullable: false
                years_of_experience:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 100.'
                  example: 24
                  nullable: false
                language:
                  type: string
                  description: 'Languages you speak.'
                  example: 'English, Persian'
                  nullable: false
                currently_learning:
                  type: string
                  description: ''
                  example: consequatur
                  nullable: false
                availability:
                  type: string
                  description: 'optional Availability status.'
                  example: 'Open to work'
                  nullable: true
                cv_url:
                  type: string
                  description: 'Must be a valid URL.'
                  example: 'http://dibbert.com/eius-est-dolor-dolores-minus-voluptatem-quisquam'
                  nullable: true
                linkedin_url:
                  type: string
                  description: 'Must be a valid URL.'
                  example: 'http://douglas.net/quo-sed-fugit-facilis-perferendis-dolores-molestias-ipsam-sit'
                  nullable: true
                github_url:
                  type: string
                  description: 'Must be a valid URL.'
                  example: 'http://www.douglas.biz/natus-earum-quas-dignissimos-perferendis'
                  nullable: true
                portfolio_image:
                  type: string
                  format: binary
                  description: 'Must be a file. Must be an image. Must be 5120 kilobytes.'
                  nullable: true
                yearsOfExperience:
                  type: integer
                  description: 'Number of years of professional experience.'
                  example: 5
                  nullable: false
                currentlyLearning:
                  type: string
                  description: "optional Technologies or skills you're currently learning."
                  example: 'Rust, AWS'
                  nullable: false
                cvUrl:
                  type: string
                  description: 'optional Link to your CV or resume.'
                  example: 'https://example.com/cv.pdf'
                  nullable: false
                linkedinUrl:
                  type: string
                  description: 'optional Link to your LinkedIn profile.'
                  example: 'https://linkedin.com/in/yourname'
                  nullable: false
                githubUrl:
                  type: string
                  description: 'optional Link to your GitHub profile.'
                  example: 'https://github.com/yourusername'
                  nullable: false
                portfolioImage:
                  type: string
                  format: binary
                  description: 'optional Portfolio image file.'
                  nullable: false
              required:
                - title
                - summary
                - location
                - years_of_experience
                - language
                - currently_learning
                - yearsOfExperience
    patch:
      summary: 'Update About Me information'
      operationId: updateAboutMeInformation
      description: 'Updates the existing About Me record.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n \"status\": true,\n \"message\": \"About Me updated successfully\",\n \"data\": {\n   ...\n }\n}"
      tags:
        - 'About Me'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Professional title.'
                  example: 'Full Stack Developer'
                  nullable: false
                summary:
                  type: string
                  description: 'Short summary about yourself.'
                  example: 'Experienced Laravel + React developer.'
                  nullable: false
                location:
                  type: string
                  description: 'Your current location.'
                  example: 'Dublin, Ireland'
                  nullable: false
                years_of_experience:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 100.'
                  example: 24
                  nullable: false
                language:
                  type: string
                  description: 'Languages you speak.'
                  example: 'English, Persian'
                  nullable: false
                currently_learning:
                  type: string
                  description: ''
                  example: consequatur
                  nullable: false
                availability:
                  type: string
                  description: 'Availability status.'
                  example: 'Open to work'
                  nullable: false
                cv_url:
                  type: string
                  description: 'Must be a valid URL.'
                  example: 'http://dibbert.com/eius-est-dolor-dolores-minus-voluptatem-quisquam'
                  nullable: false
                linkedin_url:
                  type: string
                  description: 'Must be a valid URL.'
                  example: 'http://douglas.net/quo-sed-fugit-facilis-perferendis-dolores-molestias-ipsam-sit'
                  nullable: false
                github_url:
                  type: string
                  description: 'Must be a valid URL.'
                  example: 'http://www.douglas.biz/natus-earum-quas-dignissimos-perferendis'
                  nullable: false
                portfolio_image:
                  type: string
                  format: binary
                  description: 'Must be a file. Must be an image. Must not be greater than 5120 kilobytes.'
                  nullable: false
                yearsOfExperience:
                  type: integer
                  description: 'Number of years of professional experience.'
                  example: 5
                  nullable: false
                currentlyLearning:
                  type: string
                  description: "Technologies or skills you're currently learning."
                  example: 'Rust, AWS'
                  nullable: false
                cvUrl:
                  type: string
                  description: 'Link to your CV or resume.'
                  example: 'https://example.com/cv.pdf'
                  nullable: false
                linkedinUrl:
                  type: string
                  description: 'Link to your LinkedIn profile.'
                  example: 'https://linkedin.com/in/yourname'
                  nullable: false
                githubUrl:
                  type: string
                  description: 'Link to your GitHub profile.'
                  example: 'https://github.com/yourusername'
                  nullable: false
                portfolioImage:
                  type: string
                  format: binary
                  description: 'Portfolio image file.'
                  nullable: false
    delete:
      summary: 'Delete About Me information'
      operationId: deleteAboutMeInformation
      description: 'Removes the About Me record from the system.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example: {  }
                properties: {  }
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
      tags:
        - 'About Me'
    get:
      summary: 'Get About Me content'
      operationId: getAboutMeContent
      description: 'Returns the stored information about the user.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n \"status\": true,\n \"message\": \"OK\",\n \"data\": {\n     \"id\": 1,\n     \"title\": \"Full Stack Developer\",\n     \"summary\": \"Experienced developer...\",\n     \"portfolioImage\": \"/storage/portfolio/abc123.jpg\"\n     ...\n }\n}"
      tags:
        - 'About Me'
      security: []
  /api/v1/auth/register:
    post:
      summary: 'Register a new user'
      operationId: registerANewUser
      description: 'This endpoint creates a new user and returns a JWT token upon successful registration.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'User registered successfully.'
                  data:
                    token: eyJ0eXAiOiJKV1QiLCJhbGciOi...
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'User registered successfully.'
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOi...
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email of the user.'
                  example: john@example.com
                  nullable: false
                password:
                  type: string
                  description: 'The password for the user.'
                  example: Password123!
                  nullable: false
                name:
                  type: string
                  description: 'The name of the user.'
                  example: 'John Doe'
                  nullable: false
                image:
                  type: string
                  description: 'The URL or path to the user profile image (optional).'
                  example: /storage/images/avatar.png
                  nullable: false
                password_confirmation:
                  type: string
                  description: 'Must match the password.'
                  example: Password123!
                  nullable: false
              required:
                - email
                - password
                - name
                - password_confirmation
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Login user and retrieve JWT token'
      operationId: loginUserAndRetrieveJWTToken
      description: 'Attempts to authenticate the user using email and password and returns a JWT token upon success.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'You are logged in.'
                  data:
                    token: eyJ0eXAiOiJKV1QiLCJhbGciOi...
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'You are logged in.'
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOi...
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Invalid credentials'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid credentials'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    email:
                      - 'The email field is required.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field is required.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email of the user.'
                  example: john@example.com
                  nullable: false
                password:
                  type: string
                  description: "The user's password."
                  example: Password123!
                  nullable: false
              required:
                - email
                - password
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Get current authenticated user'
      operationId: getCurrentAuthenticatedUser
      description: 'Returns the information of the currently authenticated user.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: OK
                  data:
                    user:
                      id: 1
                      name: 'John Doe'
                      email: john@example.com
                      image: /storage/images/avatar.png
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: john@example.com
                          image:
                            type: string
                            example: /storage/images/avatar.png
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      summary: 'Logout the authenticated user'
      operationId: logoutTheAuthenticatedUser
      description: 'Invalidates the current token and logs the user out.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example: {  }
                properties: {  }
      tags:
        - Authentication
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh JWT token'
      operationId: refreshJWTToken
      description: 'Returns a new JWT token by refreshing the current one.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: ''
                  data:
                    token: eyJ0eXAiOiJKV1QiLCJhbGciOi...
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOi...
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Token has expired'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Token has expired'
      tags:
        - Authentication
  /api/v1/contact-me:
    get:
      summary: 'Get all contact messages'
      operationId: getAllContactMessages
      description: 'Returns a paginated list of contact messages.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n \"status\": true,\n \"message\": \"OK\",\n \"data\": [\n   {\n     \"type\": \"contactMe\",\n     \"id\": 1,\n     \"name\": \"Roham Tehrani\",\n     \"email\": \"rohamtehrani.business@gmail.com\",\n     \"messageBody\": \"This is first message that I created.\",\n     \"links\": { \"self\": \"/api/v1/contact-me/1\" }\n   }\n ],\n \"meta\": { ... },\n \"links\": { ... }\n}"
      tags:
        - 'Contact Me'
    post:
      summary: 'Submit a contact message'
      operationId: submitAContactMessage
      description: 'Stores a new contact message.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'Your message submitted successfully.'
                  data:
                    type: contactMe
                    id: 6
                    name: 'Roham Tehrani'
                    email: rohamtehrani.business@gmail.com
                    messageBody: 'This is first message that I created.'
                    links:
                      self: /api/v1/contact-me/6
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Your message submitted successfully.'
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: contactMe
                      id:
                        type: integer
                        example: 6
                      name:
                        type: string
                        example: 'Roham Tehrani'
                      email:
                        type: string
                        example: rohamtehrani.business@gmail.com
                      messageBody:
                        type: string
                        example: 'This is first message that I created.'
                      links:
                        type: object
                        properties:
                          self:
                            type: string
                            example: /api/v1/contact-me/6
      tags:
        - 'Contact Me'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Sender name.'
                  example: 'Roham Tehrani'
                  nullable: false
                email:
                  type: string
                  description: 'Sender email.'
                  example: rohamtehrani.business@gmail.com
                  nullable: false
                message_body:
                  type: string
                  description: 'Must be at least 3 characters. Must not be greater than 2000 characters.'
                  example: hfqcoynlazghdtqtqxbaj
                  nullable: false
                contact_number:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: wbpilpmufinllwloauydl
                  nullable: true
                hp_token:
                  type: string
                  description: ''
                  example: consequatur
                  nullable: false
                messageBody:
                  type: string
                  description: 'Message body.'
                  example: 'This is first message that I created.'
                  nullable: false
              required:
                - name
                - email
                - message_body
                - hp_token
                - messageBody
  '/api/v1/contact-me/{id}':
    get:
      summary: 'Get a single contact message'
      operationId: getASingleContactMessage
      description: 'Returns the details of a contact message.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: OK
                  data:
                    type: contactMe
                    id: 1
                    name: 'Roham Tehrani'
                    email: rohamtehrani.business@gmail.com
                    messageBody: 'This is first message that I created.'
                    links:
                      self: /api/v1/contact-me/1
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: contactMe
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Roham Tehrani'
                      email:
                        type: string
                        example: rohamtehrani.business@gmail.com
                      messageBody:
                        type: string
                        example: 'This is first message that I created.'
                      links:
                        type: object
                        properties:
                          self:
                            type: string
                            example: /api/v1/contact-me/1
      tags:
        - 'Contact Me'
    delete:
      summary: 'Delete a contact message'
      operationId: deleteAContactMessage
      description: 'Removes a contact message by ID.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example: {  }
                properties: {  }
      tags:
        - 'Contact Me'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the contact message.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/users:
    get:
      summary: 'Display a paginated list of users.'
      operationId: displayAPaginatedListOfUsers
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'John Doe'
                      email: john@example.com
                      image: ...
                  meta:
                    current_page: 1
                    last_page: 10
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'John Doe'
                        email: john@example.com
                        image: ...
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'John Doe'
                        email:
                          type: string
                          example: john@example.com
                        image:
                          type: string
                          example: ...
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 10
      tags:
        - Endpoints
    post:
      summary: 'Store a newly created user.'
      operationId: storeANewlyCreatedUser
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Jane Doe'
                    email: jane@example.com
                    image: ...
                  message: 'User created successfully.'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Jane Doe'
                      email:
                        type: string
                        example: jane@example.com
                      image:
                        type: string
                        example: ...
                  message:
                    type: string
                    example: 'User created successfully.'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must be at least 3 characters. Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                  nullable: false
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: kunde.eloisa@example.com
                  nullable: false
                image:
                  type: string
                  format: binary
                  description: 'Must be a file. Must be an image. Must not be greater than 5120 kilobytes.'
                  nullable: false
                password:
                  type: string
                  description: ''
                  example: consequatur
                  nullable: false
              required:
                - name
                - email
                - password
  '/api/v1/users/{id}':
    get:
      summary: 'Display the specified user.'
      operationId: displayTheSpecifiedUser
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'John Doe'
                    email: john@example.com
                    image: ...
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        example: john@example.com
                      image:
                        type: string
                        example: ...
      tags:
        - Endpoints
    put:
      summary: 'Update the specified user.'
      operationId: updateTheSpecifiedUser
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Jane Doe'
                    email: jane@example.com
                    image: ...
                  message: 'User updated successfully.'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Jane Doe'
                      email:
                        type: string
                        example: jane@example.com
                      image:
                        type: string
                        example: ...
                  message:
                    type: string
                    example: 'User updated successfully.'
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
